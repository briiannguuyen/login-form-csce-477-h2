<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #eef1f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      form {
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        width: 100%;
        max-width: 320px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      label {
        display: block;
        margin-top: 1rem;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        padding: 0.6rem;
        margin-top: 0.3rem;
        border: 1px solid #c4c9d1;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 1rem;
      }
      button {
        width: 100%;
        margin-top: 1.5rem;
        padding: 0.7rem;
        background: #2f5bd3;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #2549ad;
      }
      #message {
        margin-top: 1rem;
        min-height: 1.2em;
        font-size: 0.9rem;
      }
      .error {
        color: #c0262d;
      }
      .success {
        color: #1d7a3a;
      }
    </style>
  </head>
  <body>
    <form id="loginForm">
      <h1>Log in</h1>

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        autocomplete="username"
        required
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      />

      <button type="submit">Log in</button>

      <p id="message"></p>
    </form>
    <script>
      const VALID_USERNAME = "admin";
      const VALID_PASSWORD = "password123";

      const form = document.getElementById("loginForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (username === "" || password === "") {
          showMessage("Enter both a username and a password.", "error");
          return;
        }

        if (username === VALID_USERNAME && password === VALID_PASSWORD) {
          showMessage("Logged in as " + username + ".", "success");
          form.reset();
        } else {
          showMessage("Incorrect username or password.", "error");
        }
      });

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
      }
    </script>
  </body>
</html>
